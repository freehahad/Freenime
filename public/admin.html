<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — freenime</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">free<span>nime</span></a>
  <a class="admin-link" href="/">Library</a>
</header>
<main class="admin-page">
  <h1>Upload a video</h1>
  <p class="muted">Only upload videos you own or are authorized to distribute.</p>
  <form id="form">
    <label>Admin key<input id="key" type="password" required></label>
    <label>Video file<input name="video" type="file" accept="video/*" required></label>
    <label>Poster (optional)<input name="poster" type="file" accept="image/*"></label>
    <button>Upload video</button>
  </form>
  <p id="status"></p>
</main>
<script>
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const status = document.getElementById("status");
  const fd = new FormData(e.target);
  status.textContent = "Uploading...";
  try {
    const r = await fetch("/api/upload", {
      method: "POST",
      headers: { "x-admin-key": document.getElementById("key").value },
      body: fd
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Upload failed");
    status.textContent = "Upload complete!";
    e.target.reset();
  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
});
</script>
</body>
</html>
