<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>freenime — Watch Online</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">free<span>nime</span></a>
  <div class="search"><input id="search" placeholder="Search videos..."></div>
  <a class="admin-link" href="/admin.html">Admin</a>
</header>

<main>
<section class="hero">
  <div>
    <p class="eyebrow">YOUR VIDEO STREAMING LIBRARY</p>
    <h1>Watch your videos<br><span>anytime.</span></h1>
    <p class="sub">A simple streaming site for videos you own or have permission to share.</p>
    <a class="button" href="#library">Browse library</a>
  </div>
</section>

<section id="library">
  <div class="section-title">
    <h2>Latest videos</h2><span id="count"></span>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>No videos yet. Upload one from Admin.</div>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
